<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #202124; margin: 0; padding: 5px; display: flex; gap: 8px; font-family: 'Segoe UI', sans-serif; align-items: center; }
        input { flex-grow: 1; background: #303134; color: white; border: 1px solid #5f6368; border-radius: 4px; padding: 6px; }
        button { background: #3c4043; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #5f6368; }
    </style>
</head>
<body>
    <button onclick="post('back')">◀</button>
    <button onclick="post('forward')">▶</button>
    <input type="text" id="url" value="https://google.com">
    <button onclick="post('go')">Go</button>
    <button onclick="post('newtab')">+</button>
    <script>
        function post(cmd) {
            let data = (cmd === 'go') ? document.getElementById('url').value : "";
            window.chrome.webview.postMessage(JSON.stringify({action: cmd, data: data}));
        }
    </script>
</body>
</html>
